<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário de HTML e CSS</title>
    <link rel="stylesheet" href="../estilos/questionario.css">
</head>

<body>
    <main>
        <h1>Questionário de HTML e CSS</h1>

        <form>
            <label for="q1">1. Qual tag HTML é usada para criar um parágrafo?</label>
            <input type="text" id="q1" name="q1">

            <label for="q2">2. Explique para que serve o CSS em uma página web.</label>
            <textarea id="q2" name="q2" rows="4"></textarea>

            <label for="q3">3. Qual propriedade CSS muda a cor do texto?</label>
            <select id="q3" name="q3">
                <option value="" selected disabled>Escolha uma...</option>
                <option value="color">color</option>
                <option value="background-color">background-color</option>
                <option value="font-size">font-size</option>
            </select>

            <label for="q4">4. Quantos níveis principais de título existem no HTML, de h1 até h6?</label>
            <input type="number" id="q4" name="q4">

            <button type="submit">Enviar Questionário</button>
        </form>
    </main>
</body>

</html>
