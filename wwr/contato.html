<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
    content="Entre em contato com Aventuras rafting para reservas, dúvidas e informações sobre nossos passeios.">
  <meta name="author" content="Yankha Lindiara">

  <title>Contato | Aventuras Rafting</title>

  <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>

  <header>
    <img src="imagens/logo.png" alt="Logo">

    <nav>
      <a href="index.html">Início</a>
      <a href="sobre.html">Sobre Nós</a>
      <a href="passeios.html">Passeios</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <main>
    <h1>Fale Conosco</h1>

    <section class="contact-info">
      <h2>Informações da Empresa</h2>

      <p><strong>Endereço:</strong> Rua das Águas, 123 - Curitiba, PR</p>

      <p><strong>Telefone:</strong> (41) 99999-9999</p>

      <p><strong>E-mail:</strong> contato@aventurasrafting.com</p>

      <iframe src="https://www.google.com/maps/embed?pb=" width="600" height="300" loading="lazy">
      </iframe>
    </section>

    <section class="employees">
      <h2>Nossa Equipe</h2>

      <div class="employee-grid">

        <figure>
          <img src="imagens/funcionario1.jpg" alt="Gerente">
          <figcaption>Ana Souza - Gerente</figcaption>
        </figure>

        <figure>
          <img src="imagens/funcionario2.jpg" alt="Instrutor">
          <figcaption>Carlos Lima - Instrutor de Rafting</figcaption>
        </figure>

        <figure>
          <img src="imagens/funcionario3.jpg" alt="Reservas">
          <figcaption>Mariana Costa - Coordenadora de Reservas</figcaption>
        </figure>

      </div>
    </section>

    <section class="contact-form">
      <h2>Envie uma Mensagem</h2>

      <form>

        <label for="name">Nome:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>

        <fieldset>
          <legend>Finalidade da Mensagem</legend>

          <label>
            <input type="radio" name="purpose" value="general" required>
            Consulta Geral
          </label>

          <label>
            <input type="radio" name="purpose" value="reservation">
            Pergunta sobre Reserva
          </label>

          <label>
            <input type="radio" name="purpose" value="suggestion">
            Sugestão de Site
          </label>

        </fieldset>

        <label for="message">Mensagem:</label>
        <textarea id="message" name="message" rows="5"></textarea>

        <label>
          <input type="checkbox" name="newsletter">
          Quero receber a newsletter mensal
        </label>

        <button type="submit">Enviar Mensagem</button>

      </form>
    </section>

  </main>

  <footer>

    <p>
      © 2026 Aventuras Rafting | Yankha Lindiara
    </p>

    <nav class="redes-sociais">

      <a href="https://facebook.com">
        <img src="imagens/facebook.png" alt="Facebook">
      </a>

      <a href="https://instagram.com">
        <img src="imagens/instagram.png" alt="Instagram">
      </a>

      <a href="https://twitter.com">
        <img src="imagens/twitter.png" alt="Twitter">
      </a>

    </nav>

  </footer>

</body>

</html>
